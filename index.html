<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagare Travels</title>
    <link rel="stylesheet" href="main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>

<body>
    <header>    
        
        <div class="logo">   
            <img src="\img\logos\IMG Vagare Logo simple.jpeg" alt="Logo de Vagare Travels">
        </div>
        
        <div class="nav-cotiza">
            

        <div class="nav">
            <nav>
                <a class="header-link" href="#">Inicio</a> 
                <a class="header-link" href="#">Destinos</a>
                <a class="header-link" href="#">Paquetes</a>
                <a class="header-link" href="#">Nosotros</a>
                <a class="header-link" href="#">Contacto</a>
            </nav> 
       </div>

        <div class="cotiza">
            <button border-left="20" class="btn">Cotiza tu viaje</button>
       </div>
       </div>
    </header>
        
    
    
    <main>
        
        <div class="hero">
            <img src="\img\hero\lets-go-travel.jpg" alt="Imagen de lugares icónicos" 
            class="d-block w-100" 
            alt="..." />
            <div>
                <h1>V A G A R E       <span>T R A V E L S</span></h1>
                <h2>by Gaby Guerra</h2>
                <h2>Lo sueñas, lo hacemos realidad</h2>
            </div>
        
        
    </main>
        
    <hr />
    
    <div class="row carrusel-principal">
        <h2>Destinos populares</h2>
        <div class="container overflow hidden"> <!-- se agregó overflow-hidden para ocultar el contenido que excede el contenedor -->
          <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner overflow-hidden"> <!-- se agregó overflow-hidden para ocultar el contenido que excede el contenedor -->
              <div class="carousel-item active">
                <img 
                    src="\img\destinations\paris.jpg" 
                    alt="Foto de Paris"
                    class="d-block w-100" 
                    alt="..." 
                />
              </div>
              <div class="carousel-item">
                <img src="\img\destinations\roma.png" 
                alt="Foto de Roma"
                class="d-block w-100" 
                alt="..." />
              </div>
              <div class="carousel-item">
                <img src="\img\destinations\londres.jpg" 
                alt="Foto de Londres"
                class="d-block w-100" 
                alt="..." />
              </div>
            </div>
            
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Previous</span>
            </button>
            
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
         </div>
    </div>
    
    <div>
        <h2>Categoría de viaje</h2>
    </div>

    <div>
        <h2>Testimonios</h2>
    </div>

    <footer>
        <div>
            <div>Contactame:</div>
            <div>Mobile: +669 123 9999 </div>
            <div>
                email: <a href="#">contacto@vagaretravels.com</a> 
            </div>
        </div>
        <hr>
        <p>&copy; 2025 Vagare Travels. Todos los derechos reservados.</p>
    
    
    
    
    </footer>
</body>
</html>
